<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Vitrina UEA - Plataforma digital para promocionar emprendimientos de moda local.">

    <meta name="author"
          content="Johnny Alberto Vera Vaca">

    <title>{% block title %}Vitrina UEA{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS del proyecto -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- ==========================================
                    ENCABEZADO
    =========================================== -->

    <header class="bg-dark text-white">

        <div class="container text-center py-4">

            <h1 class="display-5 fw-bold">
                Vitrina UEA
            </h1>

            <p class="lead mb-0">
                Plataforma digital para promocionar
                emprendimientos de moda local
            </p>

        </div>

        <!-- ==========================================
                    MENÚ DE NAVEGACIÓN
        =========================================== -->

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-top">

            <div class="container">

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar menú">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div
                    class="collapse navbar-collapse"
                    id="menuPrincipal">

                    <ul class="navbar-nav mx-auto">

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('inicio') }}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('productos') }}">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('clientes') }}">
                                Clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('proveedores') }}">
                                Proveedores
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="{{ url_for('facturacion') }}">
                                Facturación
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <!-- ==========================================
                CONTENIDO DE CADA PÁGINA
    =========================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- ==========================================
                    FOOTER
    =========================================== -->

    <footer class="bg-dark text-white mt-5">

        <div class="container text-center py-4">

            <p class="mb-1">
                <strong>Vitrina UEA</strong>
            </p>

            <p class="mb-1">
                Proyecto Integrador
                Desarrollo de Aplicaciones Web
            </p>

            <p class="mb-0">
                Johnny Alberto Vera Vaca © 2026
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript del proyecto -->

    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
