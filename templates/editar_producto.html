{% extends "base.html" %}

{% block title %}
Editar Producto - Vitrina UEA
{% endblock %}

{% block content %}

<section class="container my-5">

```
<div class="text-center mb-4">
    <h2>Editar Producto</h2>
    <p class="lead">
        Modifique los datos del producto seleccionado.
    </p>
</div>

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nombre del producto</label>
                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            value="{{ producto[1] }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea
                            name="descripcion"
                            class="form-control"
                            rows="4"
                            required>{{ producto[2] }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <input
                            type="text"
                            name="categoria"
                            class="form-control"
                            value="{{ producto[3] }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Imagen</label>
                        <input
                            type="text"
                            name="imagen"
                            class="form-control"
                            value="{{ producto[4] }}">
                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Guardar cambios
                        </button>

                        <a
                            href="{{ url_for('productos') }}"
                            class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
```

</section>

{% endblock %}
