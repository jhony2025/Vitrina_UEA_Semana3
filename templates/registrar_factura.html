{% extends "base.html" %}

{% block title %}
Registrar factura - Vitrina UEA
{% endblock %}

{% block content %}

<section class="container my-5">

    <div class="text-center mb-5">
        <h2>Registrar factura</h2>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label for="cliente_id" class="form-label">
                        Cliente
                    </label>
                    <select
                        id="cliente_id"
                        name="cliente_id"
                        class="form-select"
                        required>
                        <option value="">Seleccione un cliente</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente[0] }}">{{ cliente[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="producto_id" class="form-label">
                        Producto
                    </label>
                    <select
                        id="producto_id"
                        name="producto_id"
                        class="form-select"
                        required>
                        <option value="">Seleccione un producto</option>
                        {% for producto in productos %}
                        <option value="{{ producto[0] }}">{{ producto[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">
                        Cantidad
                    </label>
                    <input
                        type="number"
                        id="cantidad"
                        name="cantidad"
                        class="form-control"
                        min="1"
                        required>
                </div>

                <div class="mb-4">
                    <label for="precio" class="form-label">
                        Precio
                    </label>
                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar factura
                </button>

                <a href="{{ url_for('facturacion') }}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</section>

{% endblock %}
