{% extends "base.html" %}

{% block title %}
Editar proveedor - Vitrina UEA
{% endblock %}

{% block content %}

<section class="container my-5">

    <div class="text-center mb-5">
        <h2>Editar proveedor</h2>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        value="{{ proveedor[1] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">
                        Teléfono
                    </label>
                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        class="form-control"
                        value="{{ proveedor[2] or '' }}">
                </div>

                <div class="mb-4">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        class="form-control"
                        value="{{ proveedor[3] or '' }}">
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>

                <a href="{{ url_for('proveedores') }}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</section>

{% endblock %}
